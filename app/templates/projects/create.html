{% extends "base.html" %}

{% block title %}Nuevo Proyecto{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="bi bi-folder-plus text-info"></i> Alta de Proyecto</h3>
        <p class="text-muted mb-0">Crear un grupo o área de negocio para organizar servidores.</p>
    </div>
    <a href="{{ url_for('projects.list_projects') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-custom">
            <div class="card-custom-body p-4">
                <form method="POST" action="{{ url_for('projects.create_project') }}">
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label">Nombre del Proyecto *</label>
                            <input type="text" name="name" class="form-control form-control-dark" placeholder="Ej: Core Bancario y Cuentas" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Código Nemotécnico *</label>
                            <input type="text" name="code" class="form-control form-control-dark font-monospace text-uppercase" placeholder="PRJ-CORE" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Responsable Técnico / Lead</label>
                            <input type="text" name="lead_name" class="form-control form-control-dark" placeholder="Nombre del responsable">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ambiente Predominante</label>
                            <select name="environment" class="form-select form-select-dark">
                                <option value="PROD">PROD</option>
                                <option value="QA">QA</option>
                                <option value="DEV">DEV</option>
                                <option value="DR">DR</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="description" class="form-control form-control-dark" rows="3" placeholder="Objetivo de la plataforma y servicios incluidos..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top border-secondary border-opacity-25 pt-3">
                        <a href="{{ url_for('projects.list_projects') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save"></i> Guardar Proyecto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
