{% extends "base.html" %}

{% block title %}Editar Corta-Palos: {{ runbook.title }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square text-info"></i> Modificar Corta-Palos</h3>
        <p class="text-muted mb-0">Actualizar comandos o notas operativas.</p>
    </div>
    <a href="{{ url_for('runbooks.view_runbook', runbook_id=runbook.id) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Cancelar
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card-custom">
            <div class="card-custom-body p-4">
                <form method="POST" action="{{ url_for('runbooks.edit_runbook', runbook_id=runbook.id) }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Título *</label>
                            <input type="text" name="title" class="form-control form-control-dark" value="{{ runbook.title }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Categoría *</label>
                            <input type="text" name="category" class="form-control form-control-dark" value="{{ runbook.category }}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="description" class="form-control form-control-dark" rows="2">{{ runbook.description or '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Comandos / Script *</label>
                            <textarea name="command_text" class="form-control form-control-dark font-monospace text-info" rows="8" required>{{ runbook.command_text }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Servidor Específico</label>
                            <select name="server_id" class="form-select form-select-dark">
                                <option value="">-- Genérico (Todos los Servidores) --</option>
                                {% for s in servers %}
                                    <option value="{{ s.id }}" {% if runbook.server_id == s.id %}selected{% endif %}>{{ s.hostname }} ({{ s.ip_address }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Middleware Asociado</label>
                            <select name="middleware_id" class="form-select form-select-dark">
                                <option value="">-- No especificado --</option>
                                {% for m in middlewares %}
                                    <option value="{{ m.id }}" {% if runbook.middleware_id == m.id %}selected{% endif %}>{{ m.name }} ({{ m.server.hostname if m.server else '' }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" name="is_dangerous" value="1" id="is_dangerous" {% if runbook.is_dangerous %}checked{% endif %}>
                                <label class="form-check-label text-danger fw-semibold" for="is_dangerous">
                                    <i class="bi bi-exclamation-triangle-fill"></i> Marcar como COMANDO CRÍTICO / PELIGROSO
                                </label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="requires_sudo" value="1" id="requires_sudo" {% if runbook.requires_sudo %}checked{% endif %}>
                                <label class="form-check-label text-warning fw-semibold" for="requires_sudo">
                                    <i class="bi bi-shield-lock-fill"></i> Requiere elevación de privilegios (sudo / root)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top border-secondary border-opacity-25 pt-3">
                        <a href="{{ url_for('runbooks.view_runbook', runbook_id=runbook.id) }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg"></i> Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
